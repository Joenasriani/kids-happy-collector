<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Collector</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: rgba(255, 71, 87, 1);
            --secondary: rgba(46, 213, 115, 1);
            --glass: rgba(255, 255, 255, 0.2);
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: linear-gradient(to bottom, rgb(112, 161, 255), rgb(145, 204, 255)); 
            touch-action: none;
        }
        
        .ui-container {
            position: absolute;
            top: 3vmin;
            left: 3vmin;
            right: 3vmin;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2vmin;
        }

        .hud-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vmin;
            pointer-events: auto;
        }

        .icon-btn {
            width: 7vmin;
            height: 7vmin;
            background: var(--glass);
            backdrop-filter: blur(0.8vmin);
            border: 0.3vmin solid rgba(255,255,255,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0.5vmin 1.5vmin rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg { width: 4vmin; height: 4vmin; fill: white; }

        .hud-card {
            background: var(--glass);
            backdrop-filter: blur(0.8vmin);
            padding: 1.5vmin 3vmin;
            border-radius: 2.5vmin;
            border: 0.3vmin solid rgba(255,255,255,0.4);
            color: white;
            font-size: 3vmin;
            font-weight: 800;
            box-shadow: 0 0.5vmin 2vmin rgba(0,0,0,0.1);
            white-space: nowrap;
            pointer-events: none;
        }

        .message-box {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2vmin 4vmin;
            border-radius: 6vmin;
            color: rgb(255, 71, 87);
            font-weight: 900;
            font-size: 4vmin;
            display: none;
            box-shadow: 0 2vmin 5vmin rgba(0,0,0,0.15);
            z-index: 100;
            border: 0.5vmin solid rgb(255, 71, 87);
            text-align: center;
        }

        .level-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
        }

        @keyframes levelPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .level-popup h2 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 15vmin;
            color: white;
            text-shadow: 1.2vmin 1.2vmin 0px var(--primary);
            margin: 0;
        }

        .level-popup.active { display: flex; }
        .level-popup.active h2 {
            animation: levelPop 0.4s linear forwards;
        }

        .controls {
            position: absolute;
            bottom: 5vmin;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .ctrl-group { display: flex; gap: 3vmin; pointer-events: auto; align-items: center; }

        .btn {
            width: 12vmin;
            height: 12vmin;
            background: var(--glass);
            backdrop-filter: blur(1vmin);
            border: 0.4vmin solid rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 5vmin;
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.9); }
        .jump-btn { width: 22vmin; border-radius: 5vmin; font-weight: 900; font-size: 4vmin; }

        .screen-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgb(69, 104, 220), rgb(176, 106, 179));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            text-align: center;
            padding: 5vmin;
        }

        .title-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2vmin;
        }

        h1 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 12vmin;
            margin: 0;
            letter-spacing: 0.5vmin;
            text-shadow: 0.8vmin 0.8vmin 0px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .mini-hero {
            position: absolute;
            width: 5.5vmin;
            height: 5.5vmin;
            background: rgb(255, 71, 87);
            border-radius: 1.2vmin;
            box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.3);
            z-index: 10;
            left: 2.8vmin; 
            top: -150vh;
            animation: introHeroSequence 18s linear infinite;
            transform-origin: bottom center;
            opacity: 1;
        }

        .mini-eye {
            position: absolute;
            background: rgb(47, 53, 66);
            width: 1.2vmin;
            height: 1.2vmin;
            top: 1.5vmin;
            border-radius: 0.2vmin;
            animation: eyeBlink 18s linear infinite;
        }
        .mini-eye.left { left: 1.2vmin; }
        .mini-eye.right { right: 1.2vmin; }

        .mini-mouth {
            position: absolute;
            width: 2.2vmin;
            height: 1.1vmin;
            border: 0.4vmin solid rgb(47, 53, 66);
            border-top: none;
            border-radius: 0 0 1.2vmin 1.2vmin;
            bottom: 1vmin;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes eyeBlink {
            0%, 25% { transform: scaleY(1); }
            27% { transform: scaleY(0.1); }
            28% { transform: scaleY(1); }
            31% { transform: scaleY(0.1); }
            32% { transform: scaleY(1); }
            35% { transform: scaleY(0.1); }
            36%, 100% { transform: scaleY(1); }
        }

        @keyframes introHeroSequence {
            0%, 16.66% { top: -150vh; transform: scale(1) rotate(0deg); left: 2.8vmin; opacity: 0; filter: blur(0px); }
            18% { opacity: 1; }
            19% { top: -6.9vmin; transform: scale(1.4, 0.6) rotate(-90deg); left: 2.8vmin; filter: blur(0px); }
            20%, 34% { top: -6.9vmin; transform: scale(1, 1) rotate(-90deg); left: 2.8vmin; filter: blur(0px); } 
            36% { top: -6.9vmin; transform: rotate(-45deg) scale(0.9, 1.1); left: 2.8vmin; } 
            38% { top: -6.9vmin; transform: rotate(0deg) scale(1, 1); left: 2.8vmin; }
            41% { top: -6.9vmin; transform: rotate(0deg) scale(1, 1); left: 2.8vmin; filter: blur(0px); }

            42% { transform: scale(0.7, 1.4); left: 2.8vmin; filter: blur(0px); } 
            43.5% { top: -21vmin; left: 12.8vmin; transform: scale(1); filter: blur(0.8vmin); }
            45% { top: -6.9vmin; left: 22.8vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            46.5% { top: -6.9vmin; left: 22.8vmin; transform: scale(1, 1); }
            
            47.5% { transform: scale(0.7, 1.4); left: 22.8vmin; filter: blur(0px); } 
            49% { top: -21vmin; left: 32.6vmin; transform: scale(1); filter: blur(0.8vmin); }
            50.5% { top: -6.9vmin; left: 42.4vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            52% { top: -6.9vmin; left: 42.4vmin; transform: scale(1, 1); }

            53% { transform: scale(0.7, 1.4); left: 42.4vmin; filter: blur(0px); }
            54.5% { top: -21vmin; left: 52.2vmin; transform: scale(1); filter: blur(0.8vmin); }
            56% { top: -6.9vmin; left: 62.0vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            57.5% { top: -6.9vmin; left: 62.0vmin; transform: scale(1, 1); }

            58.5% { transform: scale(0.7, 1.4); left: 62.0vmin; filter: blur(0px); }
            60% { top: -21vmin; left: 71.8vmin; transform: scale(1); filter: blur(0.8vmin); }
            61.5% { top: -6.9vmin; left: 81.6vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            63% { top: -6.9vmin; left: 81.6vmin; transform: scale(1, 1); }

            64% { transform: scale(0.7, 1.4); left: 81.6vmin; filter: blur(0px); }
            65.5% { top: -21vmin; left: 91.3vmin; transform: scale(1); filter: blur(0.8vmin); }
            67% { top: -6.9vmin; left: 101.0vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            68.5% { top: -6.9vmin; left: 101.0vmin; transform: scale(1, 1); }
            
            73% { transform: scale(1.4, 0.6); left: 101.0vmin; top: -6.9vmin; filter: blur(0px); } 
            76% { transform: scale(1.9, 0.25); left: 101.0vmin; top: -6.9vmin; filter: blur(0px); } 
            
            77% { transform: scale(0.3, 3.2); left: 101.0vmin; top: -15vmin; filter: blur(1.5vmin); } 
            88% { transform: scale(0.25, 4.0); left: 101.0vmin; top: -250vh; filter: blur(3vmin); } 
            100% { top: -300vh; left: 101.0vmin; transform: scale(0.25, 4.0); filter: blur(4vmin); }
        }

        .instruction-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 3vmin;
            border-radius: 4vmin;
            max-width: 80vmin;
            text-align: center;
            margin-bottom: 3vmin;
        }

        .instruction-item {
            font-size: 3.5vmin;
            margin: 1.5vmin 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vmin;
        }

        .action-btn {
            background: rgb(46, 213, 115);
            color: white;
            border: none;
            padding: 2.5vmin 8vmin;
            font-size: 5vmin;
            font-weight: bold;
            border-radius: 8vmin;
            cursor: pointer;
            box-shadow: 0 1vmin 0 rgb(33, 157, 82);
            margin-top: 2vmin;
            transition: transform 0.1s;
        }
        .action-btn:active { transform: translateY(0.5vmin); box-shadow: 0 0.5vmin 0 rgb(33, 157, 82); }
    </style>
</head>
<body>

<div id="start-screen" class="screen-overlay">
    <div class="title-container">
        <div class="mini-hero">
            <div class="mini-eye left"></div>
            <div class="mini-eye right"></div>
            <div class="mini-mouth"></div>
        </div>
        <h1>Happy Collector</h1>
    </div>
    
    <div class="instruction-box">
        <div class="instruction-item">✨ Collect: Yellow blocks = Good Vibes</div>
        <div class="instruction-item">🚫 Avoid: Red blocks (or jump on them!)</div>
        <div class="instruction-item">❤️ Warning: 3 lives to beat level 10</div>
    </div>

    <button id="start-btn" class="action-btn">PLAY NOW</button>
</div>

<div id="game-over-screen" class="screen-overlay" style="display: none;">
    <h1 class="over-title">GAME OVER</h1>
    <p class="final-stats" style="font-size: 3.5vmin;"></p>
    <button id="restart-btn" class="action-btn">RESTART</button>
</div>

<div class="level-popup">
    <h2 id="popup-text">LEVEL 1</h2>
</div>

<div class="ui-container">
    <div class="hud-column">
        <div class="icon-btn" id="home-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <div class="hud-card">LVL: <span id="lvl-val">1</span></div>
    </div>

    <div class="hud-column" style="margin-top: 8.5vmin;">
        <div class="hud-card">PTS: <span id="score-val">0</span></div>
    </div>

    <div class="hud-column">
        <div class="icon-btn" id="fullscreen-btn">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </div>
        <div class="hud-card">LIVES: <span id="lives-val">3</span></div>
    </div>
</div>

<div class="message-box"></div>

<div class="controls">
    <div class="ctrl-group">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-group">
        <div class="btn jump-btn" id="btn-jump">JUMP</div>
    </div>
</div>

<script>
    let scene, camera, renderer, player, door;
    let platforms = [], items = [], enemies = [], clouds = [];
    let score = 0, lives = 3, level = 1;
    let velocityY = 0, velocityX = 0, isJumping = false, gameActive = false;
    let isIntroAnimating = false;
    let introProgress = 0;
    let camStart = new THREE.Vector3();
    let camEnd = new THREE.Vector3();

    const oopsies = ["OH NO!", "STAY CAREFUL!", "OOPS!", "WATCH OUT!", "TRY AGAIN!"];

    function init() {
        if (renderer) return;
        scene = new THREE.Scene();
        scene.background = new THREE.Color(rgbToHex(112, 161, 255));
        scene.fog = new THREE.FogExp2(rgbToHex(112, 161, 255), 0.003);
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(rgbToHex(255, 255, 255), 0.8));
        const sun = new THREE.DirectionalLight(rgbToHex(255, 255, 255), 0.6);
        sun.position.set(20, 100, 20);
        sun.castShadow = true;
        scene.add(sun);
        createPlayer();
        startLevelSequence(1);
        for(let i=0; i<30; i++) spawnCloud();
        animate();
    }

    function rgbToHex(r, g, b) { return (r << 16) + (g << 8) + b; }

    function createPlayer() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: rgbToHex(255, 71, 87), roughness: 0.2 }));
        body.castShadow = true;
        group.add(body);
        const eyeMat = new THREE.MeshBasicMaterial({ color: rgbToHex(47, 53, 66) });
        const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        lEye.position.set(0.6, 0.2, 0.25);
        group.add(lEye);
        const rEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        rEye.position.set(0.6, 0.2, -0.25);
        group.add(rEye);
        const mouthGeo = new THREE.TorusGeometry(0.15, 0.05, 8, 8, Math.PI);
        const mouth = new THREE.Mesh(mouthGeo, eyeMat);
        mouth.position.set(0.6, -0.1, 0);
        mouth.rotation.y = Math.PI / 2;
        mouth.rotation.x = Math.PI;
        group.add(mouth);
        player = group;
        player.position.set(0, 2, 0);
        scene.add(player);
    }

    function createDoorMesh() {
        const group = new THREE.Group();
        const frame = new THREE.Mesh(new THREE.BoxGeometry(4.0, 6.0, 0.8), new THREE.MeshStandardMaterial({ color: rgbToHex(93, 64, 55) }));
        group.add(frame);
        const panel = new THREE.Mesh(new THREE.BoxGeometry(3.2, 5.4, 0.4), new THREE.MeshStandardMaterial({ color: rgbToHex(141, 110, 99), emissive: rgbToHex(61, 43, 31), emissiveIntensity: 0.2 }));
        panel.position.z = 0.1;
        group.add(panel);
        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), new THREE.MeshStandardMaterial({ color: rgbToHex(255, 215, 0), metalness: 0.9 }));
        handle.position.set(1.1, -0.2, 0.5);
        group.add(handle);
        return group;
    }

    function spawnLevel(lvl) {
        platforms.forEach(p => scene.remove(p));
        items.forEach(it => scene.remove(it.mesh));
        enemies.forEach(en => scene.remove(en.mesh));
        if (door) scene.remove(door);
        platforms = []; items = []; enemies = [];
        const verticalClimb = lvl * 6;
        const trajType = lvl % 3;
        const segments = 5 + (lvl * 8);
        const gap = 16 + (lvl * 1.8);
        const pWidth = Math.max(4, 10 - (lvl * 0.5));
        addPlatform(0, -1, 30, rgbToHex(46, 213, 115));
        let lastY = -1;
        const goodEmotions = ["JOY", "LOVE", "BRAVE", "CALM", "HOPE", "KIND", "PROUD", "HAPPY", "PEACE", "GENTLE"];
        const badEmotions = ["ANGRY", "SAD", "FEAR", "LONELY", "GREEDY", "JEALOUS", "GRUMPY", "CRUEL", "MEAN", "RUDE"];
        for (let i = 1; i < segments; i++) {
            const x = i * gap;
            const trendY = (i / segments) * verticalClimb;
            let currentY;
            if (trajType === 0) currentY = Math.floor(trendY / 4) * 4;
            else if (trajType === 1) currentY = trendY + Math.sin(i * 0.5) * 5;
            else currentY = trendY + (i % 2 === 0 ? 3 : -3);
            if (Math.abs(currentY - lastY) < 2.5) currentY += 3.0;
            lastY = currentY;
            const p = addPlatform(x, currentY, pWidth + Math.random() * 4, rgbToHex(123, 237, 159));
            if (Math.random() > 0.4) spawnGoodDeed(x, currentY + 3.5, goodEmotions);
            else if (Math.random() > 0.3) spawnEnemy(p, badEmotions, 0.04 + (lvl * 0.015));
        }
        const finalX = segments * gap;
        const finalY = verticalClimb + 2;
        addPlatform(finalX, finalY, 20, rgbToHex(46, 213, 115));
        door = createDoorMesh();
        door.position.set(finalX, finalY + 4.0, 0);
        scene.add(door);
        camStart.set(door.position.x + 30, door.position.y + 15, 60); 
        camEnd.set(player.position.x, player.position.y + 6, 22);
    }

    function startLevelSequence(lvl) {
        gameActive = false;
        level = lvl;
        document.getElementById('lvl-val').innerText = level;
        const popup = document.querySelector('.level-popup');
        document.getElementById('popup-text').innerText = "LEVEL " + level;
        popup.classList.add('active');
        setTimeout(() => {
            popup.classList.remove('active');
            player.position.set(0, 2, 0);
            velocityY = 0; velocityX = 0;
            spawnLevel(level);
            isIntroAnimating = true; introProgress = 0;
        }, 2200);
    }

    function addPlatform(x, y, w, color) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, 10), new THREE.MeshStandardMaterial({ color: color }));
        mesh.position.set(x, y - 0.75, 0);
        mesh.receiveShadow = true;
        scene.add(mesh);
        platforms.push(mesh);
        return mesh;
    }

    function spawnGoodDeed(x, y, list) {
        const text = list[Math.floor(Math.random() * list.length)];
        const tex = createTextCanvas(text, 'rgb(61, 61, 61)', 'rgb(255, 250, 101)');
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.0, 1.5), new THREE.MeshStandardMaterial({ map: tex }));
        mesh.position.set(x, y, 0);
        mesh.castShadow = true;
        scene.add(mesh);
        items.push({ mesh, text });
    }

    function spawnEnemy(platform, list, speed) {
        const text = list[Math.floor(Math.random() * list.length)];
        const tex = createTextCanvas(text, 'white', 'rgb(255, 77, 77)');
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.8, 2.5), new THREE.MeshStandardMaterial({ map: tex }));
        mesh.position.set(platform.position.x, platform.position.y + 1.6, 0);
        mesh.castShadow = true;
        scene.add(mesh);
        enemies.push({ mesh, platform, dir: 1, speed: speed });
    }

    function spawnCloud() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: rgbToHex(255, 255, 255), transparent: true, opacity: 0.5 });
        for(let i=0; i<5; i++) {
            const p = new THREE.Mesh(new THREE.SphereGeometry(4 + Math.random() * 4, 8, 8), mat);
            p.position.x = i * 5;
            group.add(p);
        }
        group.position.set((Math.random() - 0.5) * 1500, Math.random() * 150 + 20, -200 - Math.random() * 200);
        scene.add(group);
        clouds.push(group);
    }

    function createTextCanvas(text, color, backColor) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512; canvas.height = 256; 
        ctx.fillStyle = backColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 80px Arial';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.fillText(text, 256, 150);
        return new THREE.CanvasTexture(canvas);
    }

    function handleDeath() {
        lives--;
        document.getElementById('lives-val').innerText = lives;
        popMessage(oopsies[Math.floor(Math.random() * oopsies.length)]);
        if (lives <= 0) showGameOver(false);
        else { spawnLevel(level); player.position.set(0, 2, 0); velocityY = 0; velocityX = 0; isJumping = false; }
    }

    function goHome() { gameActive = false; isIntroAnimating = false; document.getElementById('start-screen').style.display = 'flex'; document.getElementById('game-over-screen').style.display = 'none'; if(scene) { platforms.forEach(p => scene.remove(p)); items.forEach(it => scene.remove(it.mesh)); enemies.forEach(en => scene.remove(en.mesh)); if (door) scene.remove(door); } }
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }

    let keys = { left: false, right: false, up: false };

    function update() {
        if (isIntroAnimating) {
            introProgress += 0.0035; 
            const easing = introProgress < 0.5 ? 4 * introProgress * introProgress * introProgress : 1 - Math.pow(-2 * introProgress + 2, 3) / 2;
            if (introProgress >= 1) { isIntroAnimating = false; gameActive = true; camera.position.copy(camEnd); }
            else { camera.position.lerpVectors(camStart, camEnd, easing); camera.lookAt(THREE.MathUtils.lerp(door.position.x, player.position.x, easing), THREE.MathUtils.lerp(door.position.y, player.position.y, easing), 0); }
            return;
        }

        if (!gameActive) return;
        if (keys.left) velocityX = -0.38; else if (keys.right) velocityX = 0.38; else velocityX = 0;
        player.position.x += velocityX;
        velocityY -= 0.025; player.position.y += velocityY;
        
        const streakIntensity = 1 + Math.abs(velocityY) * 3.5;
        player.scale.y = THREE.MathUtils.lerp(player.scale.y, streakIntensity, 0.2);
        player.scale.x = player.scale.z = 1 / Math.sqrt(player.scale.y);

        platforms.forEach(p => {
            const pBox = new THREE.Box3().setFromObject(p);
            const playerBox = new THREE.Box3().setFromObject(player);
            if (playerBox.intersectsBox(pBox)) { if (velocityY <= 0 && player.position.y > p.position.y) { player.position.y = p.position.y + 1.35; velocityY = 0; isJumping = false; } }
        });
        if (door && player.position.distanceTo(door.position) < 4.5) { if (level >= 10) showGameOver(true); else startLevelSequence(level + 1); }
        if (keys.up && !isJumping) { velocityY = 0.6; isJumping = true; }
        items.forEach((it, idx) => {
            it.mesh.position.y += Math.sin(Date.now() * 0.005) * 0.015;
            if (player.position.distanceTo(it.mesh.position) < 3) { scene.remove(it.mesh); items.splice(idx, 1); score += 10; document.getElementById('score-val').innerText = score; }
        });
        enemies.forEach((en, idx) => {
            en.mesh.position.x += en.dir * en.speed;
            if (Math.abs(en.mesh.position.x - en.platform.position.x) > (en.platform.geometry.parameters.width / 2) - 2) en.dir *= -1;
            if (new THREE.Box3().setFromObject(player).intersectsBox(new THREE.Box3().setFromObject(en.mesh))) { if (velocityY < -0.05 && player.position.y > en.mesh.position.y + 0.5) { scene.remove(en.mesh); enemies.splice(idx, 1); velocityY = 0.42; } else handleDeath(); }
        });
        if (player.position.y < -50) handleDeath();
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.1);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, player.position.y + 6, 0.1);
        camera.lookAt(player.position.x, player.position.y + 1, 0);
    }

    function showGameOver(win) { gameActive = false; const screen = document.getElementById('game-over-screen'); screen.querySelector('h1').innerText = win ? "MASTER COLLECTOR!" : "GAME OVER"; document.querySelector('.final-stats').innerText = "Level " + level + " | Score " + score; screen.style.display = 'flex'; }
    function restartGame() { score = 0; lives = 3; level = 1; document.getElementById('score-val').innerText = score; document.getElementById('lives-val').innerText = lives; document.getElementById('lvl-val').innerText = level; document.getElementById('game-over-screen').style.display = 'none'; startLevelSequence(1); }
    function animate() { requestAnimationFrame(animate); update(); renderer.render(scene, camera); }

    const bind = (id, k) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; }, {passive: false});
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; }, {passive: false});
        el.addEventListener('mousedown', () => { keys[k] = true; });
        el.addEventListener('mouseup', () => { keys[k] = false; });
    };
    bind('btn-left', 'left'); bind('btn-right', 'right'); bind('btn-jump', 'up');
    window.addEventListener('keydown', (e) => { if(e.code === 'ArrowLeft' || e.key === 'a') keys.left = true; if(e.code === 'ArrowRight' || e.key === 'd') keys.right = true; if(e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') { e.preventDefault(); keys.up = true; } });
    window.addEventListener('keyup', (e) => { if(e.code === 'ArrowLeft' || e.key === 'a') keys.left = false; if(e.code === 'ArrowRight' || e.key === 'd') keys.right = false; if(e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') keys.up = false; });
    document.getElementById('start-btn').onclick = () => { document.getElementById('start-screen').style.display = 'none'; init(); restartGame(); };
    document.getElementById('restart-btn').onclick = restartGame;
    document.getElementById('home-btn').onclick = goHome;
    document.getElementById('fullscreen-btn').onclick = toggleFullScreen;

    function popMessage(txt) { const msg = document.querySelector('.message-box'); msg.innerText = txt; msg.style.display = 'block'; setTimeout(() => { msg.style.display = 'none'; }, 1500); }

    window.addEventListener('resize', () => { if(camera && renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } });
</script>
</body>
</html>
