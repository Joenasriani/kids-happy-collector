<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Collector</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: rgba(255, 230, 0, 1);
            --danger: rgba(255, 71, 87, 1);
            --glass: rgba(255, 255, 255, 0.2);
        }
        html, body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            font-family: sans-serif; 
            background: linear-gradient(to bottom, rgb(112, 161, 255), rgb(145, 204, 255)); 
            touch-action: none;
        }
        
        .ui-container {
            position: absolute;
            top: 3vmin;
            left: 3vmin;
            right: 3vmin;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 50;
        }

        .hud-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vmin;
            pointer-events: none;
        }

        .icon-btn {
            width: 7vmin;
            height: 7vmin;
            background: var(--glass);
            border: 0.3vmin solid rgba(255,255,255,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.1);
            transition: transform 0.1s;
            pointer-events: auto;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg { width: 4vmin; height: 4vmin; fill: white; }

        .hud-card {
            background: var(--glass);
            padding: 1.5vmin 3vmin;
            border-radius: 3.5vmin;
            border: 0.4vmin solid rgba(255,255,255,0.4);
            color: white;
            font-size: 3.5vmin;
            font-weight: 900;
            box-shadow: 0 1vmin 3vmin rgba(0,0,0,0.15);
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 0.2vmin 0.5vmin rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .score-card {
            font-size: 5vmin;
            padding: 2vmin 5vmin;
            border-width: 0.6vmin;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3.5vmin;
        }

        .notification-alert {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgb(255, 71, 87);
            color: white;
            padding: 2vmin 6vmin;
            border-radius: 4vmin;
            font-family: 'Luckiest Guy', cursive;
            font-size: 5vmin;
            display: none;
            box-shadow: 0 1.5vmin 4vmin rgba(0,0,0,0.3);
            z-index: 2000;
            border: 0.5vmin solid white;
            white-space: nowrap;
            pointer-events: none;
            animation: notifyIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes notifyIn {
            0% { transform: translate(-50%, -20%); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .level-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
        }

        .level-popup.active { display: flex; }
        .level-popup.active h2 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 15vmin;
            color: white;
            text-shadow: 1.2vmin 1.2vmin 0px rgb(255, 71, 87);
            margin: 0;
            animation: levelPop 0.4s linear forwards;
        }

        @keyframes levelPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .controls {
            position: absolute;
            bottom: 5vmin;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 100;
        }

        .ctrl-group { display: flex; gap: 3vmin; pointer-events: auto; align-items: center; }

        .btn {
            width: 14vmin;
            height: 14vmin;
            background: var(--glass);
            border: 0.4vmin solid rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 6vmin;
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.9); }
        .jump-btn { width: 26vmin; border-radius: 6vmin; font-weight: 900; font-size: 5vmin; }

        .screen-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, #4568dc, #b06ab3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        .title-container {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 12vmin;
            margin: 0;
            letter-spacing: 0.5vmin;
            text-shadow: 0.8vmin 0.8vmin 0px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .mini-hero {
            position: absolute;
            width: 5.5vmin;
            height: 5.5vmin;
            background: rgb(255, 230, 0);
            border-radius: 1.2vmin;
            box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.3);
            z-index: 10;
            left: 2.8vmin; 
            top: -150vh;
            animation: introHeroSequence 10s linear infinite;
            transform-origin: bottom center;
            opacity: 1;
            filter: none;
        }

        .mini-eye {
            position: absolute;
            background: rgb(47, 53, 66);
            width: 1.2vmin;
            height: 1.2vmin;
            top: 1.5vmin;
            border-radius: 0.2vmin;
            animation: eyeBlink 10s linear infinite;
        }
        .mini-eye.left { left: 1.2vmin; }
        .mini-eye.right { right: 1.2vmin; }

        .mini-mouth {
            position: absolute;
            width: 2.2vmin;
            height: 1.1vmin;
            border: 0.4vmin solid rgb(47, 53, 66);
            border-top: none;
            border-radius: 0 0 1.2vmin 1.2vmin;
            bottom: 1vmin;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes eyeBlink {
            0%, 25% { transform: scaleY(1); }
            27% { transform: scaleY(0.1); }
            28% { transform: scaleY(1); }
            31% { transform: scaleY(0.1); }
            32% { transform: scaleY(1); }
            35% { transform: scaleY(0.1); }
            36%, 100% { transform: scaleY(1); }
        }

        @keyframes introHeroSequence {
            0%, 15% { top: -150vh; transform: scale(1) rotate(0deg); left: 2.8vmin; opacity: 0; filter: none; }
            17% { opacity: 1; }
            18.5% { top: -6.9vmin; transform: scale(1.1, 0.9) rotate(-90deg); left: 2.8vmin; filter: none; }
            20%, 34% { top: -6.9vmin; transform: scale(1, 1) rotate(-90deg); left: 2.8vmin; filter: none; } 
            36% { top: -6.9vmin; transform: rotate(-45deg) scale(0.98, 1.02); left: 2.8vmin; filter: none; } 
            38% { top: -6.9vmin; transform: rotate(0deg) scale(1, 1); left: 2.8vmin; filter: none; }
            40% { top: -6.9vmin; left: 2.8vmin; transform: scale(0.95, 1.05); }
            43.2% { top: -21vmin; left: 12.44vmin; transform: scale(1, 1); }
            46.4% { top: -6.9vmin; left: 22.08vmin; transform: scale(1.1, 0.9); }
            46.6% { transform: scale(0.95, 1.05); }
            49.6% { top: -21vmin; left: 31.72vmin; transform: scale(1, 1); }
            52.8% { top: -6.9vmin; left: 41.36vmin; transform: scale(1.1, 0.9); }
            53% { transform: scale(0.95, 1.05); }
            56% { top: -21vmin; left: 51vmin; transform: scale(1, 1); }
            59.2% { top: -6.9vmin; left: 60.64vmin; transform: scale(1.1, 0.9); }
            59.4% { transform: scale(0.95, 1.05); }
            62.4% { top: -21vmin; left: 70.28vmin; transform: scale(1, 1); }
            65.6% { top: -6.9vmin; left: 79.92vmin; transform: scale(1.1, 0.9); }
            65.8% { transform: scale(0.95, 1.05); }
            68.8% { top: -21vmin; left: 89.56vmin; transform: scale(1, 1); }
            72% { top: -6.9vmin; left: 99.2vmin; transform: scale(1.1, 0.9); }
            73.5%, 75% { top: -14vmin; left: 99.2vmin; transform: scale(0.98, 1.02); } 
            77% { top: -6.9vmin; left: 99.2vmin; transform: scale(1.15, 0.85); filter: none; } 
            81% { transform: scale(0.3, 3.5); top: -20vmin; filter: blur(8px); left: 99.2vmin; }
            100% { top: -350vh; transform: scale(0.2, 4); filter: blur(60px); left: 99.2vmin; }
        }

        .landing-dust {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            animation: dustBurstFade 0.6s ease-out forwards;
        }

        @keyframes dustBurstFade {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
            100% { transform: scale(2.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }


        .micro-award {
            position: fixed;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 160;
            font-family: 'Luckiest Guy', cursive;
            font-size: clamp(18px, 4vmin, 34px);
            letter-spacing: 0.06em;
            color: white;
            text-shadow: 0 0.35vmin 0.8vmin rgba(0,0,0,0.22);
            animation: microAwardFloat 0.82s cubic-bezier(0.2, 0.9, 0.25, 1) forwards;
            will-change: transform, opacity;
        }

        .micro-award.collect {
            color: rgb(255, 246, 116);
        }

        .micro-award.stomp {
            color: rgb(255, 255, 255);
        }

        .micro-award.damage {
            color: rgb(255, 232, 232);
            font-size: clamp(16px, 3.2vmin, 28px);
        }

        .micro-award.fall {
            color: rgb(255, 255, 255);
            font-size: clamp(16px, 3.2vmin, 28px);
            animation: microAwardFallFloat 1.75s cubic-bezier(0.2, 0.9, 0.25, 1) forwards;
        }

        @keyframes microAwardFallFloat {
            0% { opacity: 0; transform: translate(-50%, -35%) scale(0.75); }
            12% { opacity: 1; transform: translate(-50%, -55%) scale(1.08); }
            72% { opacity: 1; transform: translate(-50%, -105%) scale(0.96); }
            100% { opacity: 0; transform: translate(-50%, -140%) scale(0.86); }
        }

        @keyframes microAwardFloat {
            0% { opacity: 0; transform: translate(-50%, -35%) scale(0.75); }
            16% { opacity: 1; transform: translate(-50%, -55%) scale(1.08); }
            100% { opacity: 0; transform: translate(-50%, -145%) scale(0.86); }
        }

        .micro-sparkle {
            position: fixed;
            left: 0;
            top: 0;
            width: clamp(5px, 1.2vmin, 10px);
            height: clamp(5px, 1.2vmin, 10px);
            border-radius: 50%;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 1.2vmin rgba(255, 246, 116, 0.7);
            pointer-events: none;
            z-index: 155;
            animation: microSparkleBurst 0.68s ease-out forwards;
            will-change: transform, opacity;
        }

        .micro-sparkle.soft-red {
            background: rgba(255, 165, 165, 0.85);
            box-shadow: 0 0 1vmin rgba(255, 71, 87, 0.45);
        }

        .micro-sparkle.cloud {
            background: rgba(255,255,255,0.72);
            box-shadow: none;
        }

        @keyframes microSparkleBurst {
            0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.4); }
        }

        .soft-impact-ring {
            position: fixed;
            left: 0;
            top: 0;
            width: clamp(26px, 6vmin, 56px);
            height: clamp(26px, 6vmin, 56px);
            border-radius: 50%;
            border: 0.45vmin solid rgba(255, 111, 125, 0.75);
            background: rgba(255, 71, 87, 0.08);
            transform: translate(-50%, -50%) scale(0.45);
            pointer-events: none;
            z-index: 150;
            animation: softImpactRing 0.48s ease-out forwards;
        }

        @keyframes softImpactRing {
            0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.45); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
        }

        .action-btn {
            font-family: 'Luckiest Guy', cursive !important;
            background: linear-gradient(180deg, #2ed573 0%, #26af5c 100%);
            color: white;
            border: none;
            padding: 3vmin 12vmin;
            font-size: 8vmin;
            letter-spacing: 0.2vmin;
            border-radius: 12vmin;
            cursor: pointer;
            box-shadow: 0 1.2vmin 0 #1b7a40, 0 2vmin 4vmin rgba(0,0,0,0.3);
            margin-top: 5vmin;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            text-shadow: 0 0.4vmin 0.8vmin rgba(0,0,0,0.2);
            animation: buttonPulse 2.5s infinite ease-in-out;
            pointer-events: auto;
        }
        @keyframes buttonPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
        .action-btn:hover { animation-play-state: paused; transform: scale(1.1); box-shadow: 0 1.5vmin 0 #1b7a40, 0 3vmin 6vmin rgba(0,0,0,0.4); }
        .action-btn:active { transform: translateY(1vmin) scale(1); box-shadow: 0 0.2vmin 0 #1b7a40; }

        .instruction-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 2vmin 2.4vmin;
            border-radius: 3vmin;
            max-width: 68vmin;
            text-align: center;
            margin-bottom: 0.7vmin;
        }

        .instruction-item {
            font-size: 2.75vmin;
            margin: 0.65vmin 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.3vmin;
        }


        .hud-icon-row {
            display: flex;
            gap: 1.5vmin;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .music-btn {
            margin-top: 0;
        }
        .music-btn.off {
            opacity: 0.55;
        }
        .music-btn .music-symbol {
            width: 3.5vmin;
            height: 3.5vmin;
            display: block;
            fill: white;
        }
        .music-btn .music-off-icon { display: none; }
        .music-btn.off .music-on-icon { display: none; }
        .music-btn.off .music-off-icon { display: block; }
        .intro-credits {
            margin-top: 2.2vmin;
            font-size: 1.75vmin;
            line-height: 1.45;
            opacity: 0.72;
            letter-spacing: 0.04vmin;
            text-shadow: 0 0.2vmin 0.5vmin rgba(0,0,0,0.18);
            pointer-events: none;
        }
        .intro-credits strong {
            font-weight: 900;
            color: rgba(255,255,255,0.94);
        }


        /* Start page spacing polish: keep title/mini-hero unchanged, lower the info card and button, pin credits as footer. */
        .start-screen .instruction-box {
            position: relative;
            top: 4.8vmin;
        }
        .start-screen .start-btn {
            position: relative;
            top: 6.8vmin;
        }
        .start-screen .intro-credits {
            position: absolute;
            left: 50%;
            bottom: max(2.2vmin, calc(env(safe-area-inset-bottom) + 1.2vmin));
            transform: translateX(-50%);
            margin-top: 0;
            width: min(90vw, 80vmin);
        }
    </style>
</head>
<body>

<div class="start-screen screen-overlay">
    <div class="title-container" id="intro-title-container">
        <div class="mini-hero" id="intro-mini-hero">
            <div class="mini-eye left"></div>
            <div class="mini-eye right"></div>
            <div class="mini-mouth"></div>
        </div>
        <h1>Happy Collector</h1>
    </div>
    
    <div class="instruction-box">
        <div class="instruction-item">✨ Collect: Yellow blocks = Good Emotions</div>
        <div class="instruction-item">🚫 Avoid: Red blocks = Bad Emotions</div>
        <div class="instruction-item">❤️ Warning: 3 lives to beat level 10</div>
    </div>

    <button class="start-btn action-btn">PLAY NOW</button>
    <div class="intro-credits">
        <div><strong>Game Dev:</strong> ApexInnovate.ae</div>
        <div><strong>Music:</strong> BombInSound, AlexZavesa</div>
    </div>
</div>

<div class="game-over-screen screen-overlay" style="display: none;">
    <h1 class="over-title">GAME OVER</h1>
    <p class="final-stats" style="font-size: 3.5vmin;"></p>
    <button class="restart-btn action-btn">RESTART</button>
</div>

<div class="level-popup">
    <h2 id="popup-text">LEVEL 1</h2>
</div>

<div class="ui-container">
    <div class="hud-column">
        <div class="hud-card">LVL: <span id="lvl-val">1</span></div>
        <div class="icon-btn home-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
    </div>

    <div class="score-wrapper">
        <div class="hud-card score-card">PTS: <span id="score-val">0</span></div>
        <div class="notification-alert">LAST LIFE: STAY BRAVE! ❤️</div>
    </div>

    <div class="hud-column">
        <div class="hud-card">LIVES: <span id="lives-val">3</span></div>
        <div class="hud-icon-row">
            <div class="icon-btn fullscreen-btn">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </div>
            <div class="icon-btn music-btn" aria-label="Music on" title="Music on">
                <svg class="music-symbol music-on-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11.1A3.5 3.5 0 1 1 10 11V6h8V3h-6z"/></svg>
                <svg class="music-symbol music-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11.1A3.5 3.5 0 1 1 10 11V6h8V3h-6z"/><path d="M3.7 3.1 21 20.4l-1.4 1.4L2.3 4.5z"/></svg>
            </div>
        </div>
    </div>
</div>

<div class="controls">
    <div class="ctrl-group">
        <div class="btn btn-left">◀</div>
        <div class="btn btn-right">▶</div>
    </div>
    <div class="ctrl-group">
        <div class="btn jump-btn btn-jump">JUMP</div>
    </div>
</div>

<script>
    let scene, camera, renderer, player, door, characterShadow;
    let platforms = [], items = [], enemies = [], clouds = [], particles = [];
    let score = 0, lives = 3, level = 1;
    let velocityY = 0, velocityX = 0, isJumping = false, gameActive = false, isDying = false;
    let fallCueStarted = false, fallCueStartTime = 0, lastGroundCenterY = 2, lowestPlatformSurfaceY = Infinity;
    let isIntroAnimating = false, introProgress = 0, levelTransitioning = false;
    let camStart = new THREE.Vector3(), camEnd = new THREE.Vector3();
    let cinematicDoorPos = new THREE.Vector3(); 
    let lastTime = performance.now();


    const AudioFX = (() => {
        let ctx = null;
        let master = null;
        const maxVolume = 0.42;

        function ensure() {
            if (!ctx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return null;
                ctx = new AudioContext();
                master = ctx.createGain();
                master.gain.value = maxVolume;
                master.connect(ctx.destination);
            }
            if (ctx.state === 'suspended') ctx.resume().catch(() => {});
            return ctx;
        }

        function tone(freq, duration, type = 'sine', gain = 0.18, delay = 0, detune = 0) {
            const ac = ensure();
            if (!ac) return;
            const t = ac.currentTime + delay;
            const osc = ac.createOscillator();
            const amp = ac.createGain();
            const filter = ac.createBiquadFilter();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            osc.detune.setValueAtTime(detune, t);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1800, t);
            filter.Q.setValueAtTime(0.5, t);
            amp.gain.setValueAtTime(0.0001, t);
            amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + 0.025);
            amp.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.connect(filter);
            filter.connect(amp);
            amp.connect(master);
            osc.start(t);
            osc.stop(t + duration + 0.05);
        }

        function glide(from, to, duration, type = 'sine', gain = 0.16) {
            const ac = ensure();
            if (!ac) return;
            const t = ac.currentTime;
            const osc = ac.createOscillator();
            const amp = ac.createGain();
            const filter = ac.createBiquadFilter();
            osc.type = type;
            osc.frequency.setValueAtTime(from, t);
            osc.frequency.exponentialRampToValueAtTime(to, t + duration);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1500, t);
            amp.gain.setValueAtTime(0.0001, t);
            amp.gain.exponentialRampToValueAtTime(gain, t + 0.03);
            amp.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.connect(filter);
            filter.connect(amp);
            amp.connect(master);
            osc.start(t);
            osc.stop(t + duration + 0.05);
        }

        function softNoise(duration = 0.18, gain = 0.08, cutoff = 900) {
            const ac = ensure();
            if (!ac) return;
            const buffer = ac.createBuffer(1, ac.sampleRate * duration, ac.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
            const src = ac.createBufferSource();
            const amp = ac.createGain();
            const filter = ac.createBiquadFilter();
            src.buffer = buffer;
            filter.type = 'lowpass';
            filter.frequency.value = cutoff;
            amp.gain.value = gain;
            src.connect(filter);
            filter.connect(amp);
            amp.connect(master);
            src.start();
        }

            fall() {

                const amp = ac.createGain();

                osc.type = 'triangle';

                osc.connect(filter);
                filter.connect(amp);
                filter.connect(delay);
                delay.connect(feedback);
                feedback.connect(delay);
                delay.connect(echoAmp);
                amp.connect(master);

        ];
        let audio = null;
        let enabled = true;
        let currentIndex = -1;
        let fadeTimer = null;
        let preloadLinks = [];
        const baseVolume = 0.022;

        function ensureAudio() {
            if (!audio) {
                audio = new Audio();
                audio.loop = true;
                audio.preload = 'auto';
                audio.volume = 0;
            }
            return audio;
        }

        function setButtonState() {
            const btn = document.querySelector('.music-btn');
            if (!btn) return;
            btn.classList.toggle('off', !enabled);
            btn.setAttribute('aria-label', enabled ? 'Music on' : 'Music off');
            btn.setAttribute('title', enabled ? 'Music on' : 'Music off');
        }

        function fadeTo(target, duration = 550, after = null) {
            const a = ensureAudio();
            if (fadeTimer) clearInterval(fadeTimer);
            const start = a.volume;
            const startTime = performance.now();
            fadeTimer = setInterval(() => {
                const t = Math.min(1, (performance.now() - startTime) / duration);
                a.volume = start + (target - start) * t;
                if (t >= 1) {
                    clearInterval(fadeTimer);
                    fadeTimer = null;
                    if (after) after();
                }
            }, 40);
        }

        function playForLevel(lvl) {
            if (!enabled) return;
            const a = ensureAudio();
            const index = Math.max(0, (lvl - 1) % tracks.length);
            const track = tracks[index];
            const switchTrack = () => {
                if (currentIndex !== index) {
                    currentIndex = index;
                    a.src = track.src;
                    a.currentTime = 0;
                }
                a.volume = baseVolume;
                a.play().catch(() => {});
            };
            if (!a.paused && currentIndex !== index) fadeTo(0, 350, switchTrack);
            else switchTrack();
        }

        function stop() {
            if (!audio) return;
            fadeTo(0, 350, () => {
                if (audio) audio.pause();
            });
        }

        function toggle() {
            enabled = !enabled;
            setButtonState();
            if (!enabled) stop();
            else if (level > 0 && gameActive && !isIntroAnimating) playForLevel(level);
        }

        function preload() {
            if (!preloadLinks.length) {
                preloadLinks = tracks.map((track) => {
                    const link = document.createElement('link');
                    link.rel = 'preload';
                    link.as = 'audio';
                    link.href = track.src;
                    document.head.appendChild(link);
                    return link;
                });
            }
            setButtonState();
        }

        return { tracks, preload, playForLevel, stop, toggle, setButtonState };
    })();


    const CinematicWind = (() => {
        const src = './sfx/dragon-studio-winter-wind-402331.mp3';
        let audio = null;
        let fadeTimer = null;
        const peakVolume = 0.025;

        function ensureAudio() {
            if (!audio) {
                audio = new Audio(src);
                audio.loop = false;
                audio.preload = 'auto';
                audio.volume = 0;
            }
            return audio;
        }

        function clearFade() {
            if (fadeTimer) {
                clearInterval(fadeTimer);
                fadeTimer = null;
            }
        }

        function fadeTo(target, duration = 700, after = null) {
            const a = ensureAudio();
            clearFade();
            const start = a.volume;
            const startTime = performance.now();
            fadeTimer = setInterval(() => {
                const t = Math.min(1, (performance.now() - startTime) / duration);
                a.volume = start + (target - start) * t;
                if (t >= 1) {
                    clearFade();
                    if (after) after();
                }
            }, 40);
        }

        function playCinematic(totalMs = 4200) {
            const a = ensureAudio();
            clearFade();
            a.pause();
            a.loop = false;
            a.currentTime = 0;
            a.volume = 0;
            a.play().then(() => {
                fadeTo(peakVolume, 500);
                const fadeStart = Math.max(900, totalMs - 2200);
                setTimeout(() => {
                    if (!audio || audio.paused) return;
                    fadeTo(0, 1900, () => {
                        if (audio) {
                            audio.pause();
                            audio.currentTime = 0;
                        }
                    });
                }, fadeStart);
            }).catch(() => {});
        }

        function stop() {
            if (!audio) return;
            fadeTo(0, 900, () => {
                if (audio) {
                    audio.pause();
                    audio.loop = false;
                    audio.currentTime = 0;
                }
            });
        }

        function preload() {
            ensureAudio();
        }

        return { preload, playCinematic, stop };
    })();

    function createCharacterShadow() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(128, 128, 10, 128, 128, 120);
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
        gradient.addColorStop(0.42, 'rgba(0, 0, 0, 0.30)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 256, 256);

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            opacity: 0.36,
            depthWrite: false
        });
        characterShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
        characterShadow.rotation.x = -Math.PI / 2;
        characterShadow.renderOrder = 5;
        characterShadow.visible = false;
        scene.add(characterShadow);
    }

    function updateCharacterShadow() {
        if (!characterShadow || !player || !player.visible || !gameActive || isDying) {
            if (characterShadow) characterShadow.visible = false;
            return;
        }

        let targetPlatform = null;
        let targetSurfaceY = -Infinity;
        for (const p of platforms) {
            const params = p.geometry.parameters;
            const halfW = params.width / 2;
            const halfD = params.depth / 2;
            const surfaceY = p.position.y + (params.height / 2);
            const insideX = player.position.x >= p.position.x - halfW && player.position.x <= p.position.x + halfW;
            const insideZ = player.position.z >= p.position.z - halfD && player.position.z <= p.position.z + halfD;
            const belowPlayer = surfaceY <= player.position.y + 0.15;
            if (insideX && insideZ && belowPlayer && surfaceY > targetSurfaceY) {
                targetPlatform = p;
                targetSurfaceY = surfaceY;
            }
        }

        if (!targetPlatform) {
            characterShadow.visible = false;
            return;
        }

        const playerBottomY = player.position.y - (0.62 * player.scale.y);
        const airHeight = Math.max(0, playerBottomY - targetSurfaceY);
        const heightFade = THREE.MathUtils.clamp(1 - (airHeight / 6.5), 0.18, 1);
        const heightSpread = 1 + Math.min(airHeight * 0.13, 0.85);
        const turnSquash = 1 + Math.abs(Math.sin(player.rotation.y)) * 0.08;

        characterShadow.position.set(player.position.x, targetSurfaceY + 0.04, player.position.z + 0.22);
        characterShadow.scale.set(2.15 * heightSpread * turnSquash, 1.18 * heightSpread, 1);
        characterShadow.material.opacity = 0.38 * heightFade;
        characterShadow.visible = true;
    }

    function disposeObject(obj) {
        if (!obj) return;
        obj.traverse?.((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach((mat) => {
                    if (mat.map) mat.map.dispose();
                    mat.dispose();
                });
            }
        });
    }

    function getProfileGap(lvl, i, segments) {
        const t = i / segments;
        const base = 4.9 + (lvl * 0.22);
        let shape = 0;
        if (lvl === 1) shape = Math.sin(i * 0.8) * 0.15;
        else if (lvl === 2) shape = Math.sin(i * 1.1) * 0.35;
        else if (lvl === 3) shape = (i % 3 === 0 ? 0.35 : -0.15) + Math.sin(i * 0.6) * 0.2;
        else if (lvl === 4) shape = (i % 4 === 0 ? 0.55 : i % 4 === 1 ? -0.25 : 0.15);
        else if (lvl === 5) shape = Math.sin(t * Math.PI * 2) * 0.45 + (t > 0.45 && t < 0.7 ? -0.25 : 0.15);
        else if (lvl === 6) shape = (i % 5 === 0 ? 0.55 : i % 2 === 0 ? -0.2 : 0.25);
        else if (lvl === 7) shape = (i % 4 === 2 ? 0.65 : -0.05) + Math.sin(i * 0.55) * 0.2;
        else if (lvl === 8) shape = Math.sin(t * Math.PI * 4) * 0.55;
        else if (lvl === 9) shape = (i % 6 < 2 ? 0.55 : i % 6 < 4 ? -0.15 : 0.25);
        else shape = (i % 7 === 3 ? 0.65 : i % 5 === 0 ? -0.25 : 0.2) + Math.sin(t * Math.PI * 3) * 0.25;
        return Math.max(4.75, Math.min(7.35, base + shape));
    }

    function getProfileY(lvl, i, segments, verticalClimb) {
        const t = i / segments;
        const climb = verticalClimb * t;
        if (lvl === 1) return climb * 0.65 + Math.sin(i * 0.6) * 0.35;
        if (lvl === 2) return climb * 0.75 + Math.sin(t * Math.PI * 2) * 1.0;
        if (lvl === 3) return climb * 0.82 + Math.sin(t * Math.PI * 3) * 1.25;
        if (lvl === 4) return climb + Math.floor(t * 5) * 0.45 - Math.sin(t * Math.PI * 2) * 0.45;
        if (lvl === 5) return climb * 0.95 - Math.sin(t * Math.PI) * 3.0 + Math.sin(t * Math.PI * 3) * 0.6;
        if (lvl === 6) return climb * 0.9 + (i % 4 < 2 ? 0.85 : -0.65);
        if (lvl === 7) return climb * 0.78 + Math.sin(i * 0.85) * 1.45;
        if (lvl === 8) return climb * 0.88 + Math.sin(t * Math.PI * 4) * 2.0;
        if (lvl === 9) return climb + Math.sin(t * Math.PI * 5) * 1.55 + (i % 5 === 0 ? -0.7 : 0.35);
        return climb + Math.floor(t * 6) * 0.35 + Math.sin(t * Math.PI * 3) * 1.15;
    }

    function spawnLevel(lvl) {
        platforms.forEach(p => { scene.remove(p); disposeObject(p); });
        items.forEach(it => { scene.remove(it.mesh); disposeObject(it.mesh); });
        enemies.forEach(en => { scene.remove(en.mesh); disposeObject(en.mesh); });
        if (door) { scene.remove(door); disposeObject(door); door = null; }
        platforms = []; items = []; enemies = [];
        lowestPlatformSurfaceY = Infinity;
        const segments = 5 + (lvl * 5);
        const verticalClimb = lvl * 4.5;
        
        const platformWidth = Math.max(10, 26 - (lvl * 1.6)); 
        const maxStepUp = 2.95;
        const maxStepDown = 3.25;
        
        let enemyCount = lvl === 1 ? 2 : lvl === 2 ? 3 : Math.floor(lvl * 1.2) + 1;
        const enemySpeed = 0.03 + (lvl * 0.012);
        
        const possibleIndices = [];
        for (let j = 1; j < segments - 1; j++) possibleIndices.push(j);
        const selectedEnemyIndices = possibleIndices.sort(() => Math.random() - 0.5).slice(0, enemyCount);

        addPlatform(0, -1, 35, 0x2ed573);
        let lastY = -1;
        let currentX = 0;
        let prevWidth = 35;
        const goodEmotions = ["BRAVERY", "JOY", "LOVE", "HOPE", "PEACE", "KINDNESS", "CALM", "PRIDE", "TRUST", "HAPPINESS"];
        const badEmotions = ["ANGER", "GREED", "JEALOUSY", "RUDENESS", "ENVY", "HATE", "DESPAIR"];
        
        let consecutiveEmpty = 0;

        for (let i = 1; i < segments; i++) {
            const gap = getProfileGap(lvl, i, segments);
            currentX += (prevWidth / 2) + (platformWidth / 2) + gap;
            prevWidth = platformWidth;
            let currentY = getProfileY(lvl, i, segments, verticalClimb);
            if (currentY - lastY > maxStepUp) currentY = lastY + maxStepUp;
            else if (lastY - currentY > maxStepDown) currentY = lastY - maxStepDown;
            lastY = currentY;
            const p = addPlatform(currentX, currentY, platformWidth, 0x7bed9f);
            
            if (selectedEnemyIndices.includes(i)) {
                spawnEnemy(p, badEmotions, enemySpeed);
                consecutiveEmpty = 0;
            } else {
                if (Math.random() > 0.15 || consecutiveEmpty >= 1 || i === 1) {
                    spawnGoodDeed(currentX + (Math.random() - 0.5) * 4, currentY + 6.0, goodEmotions);
                    consecutiveEmpty = 0;
                } else {
                    consecutiveEmpty++;
                }
            }
        }
        const finalGap = getProfileGap(lvl, segments, segments);
        const finalX = currentX + (platformWidth / 2) + 10 + finalGap;
        let finalY = verticalClimb + 2;
        if (lvl === 5) finalY = Math.max(lastY + 1.2, verticalClimb * 0.7);
        else if (lvl === 7) finalY = Math.max(lastY + 0.4, verticalClimb * 0.65);
        else if (lvl === 8) finalY = Math.max(lastY + 1.0, verticalClimb * 0.75);
        else if (lvl === 10) finalY = Math.max(lastY + 1.5, verticalClimb * 0.85);
        if (finalY - lastY > maxStepUp) finalY = lastY + maxStepUp;
        else if (lastY - finalY > maxStepDown) finalY = lastY - maxStepDown;
        addPlatform(finalX, finalY, 20, 0x2ed573);
        if (!Number.isFinite(lowestPlatformSurfaceY)) lowestPlatformSurfaceY = -1;
        door = createDoorMesh(); door.position.set(finalX, finalY + 4, 0); scene.add(door);
        cinematicDoorPos.copy(door.position);
        camStart.set(door.position.x + 30, door.position.y + 15, 60); 
        camEnd.set(0, 2 + 6, 22);
    }

    function startLevelSequence(lvl, withCinematic = true, showPopup = true) {
        gameActive = false; isIntroAnimating = false; levelTransitioning = true;
        resetInput();
        if (player) {
            player.visible = false;

        if (characterShadow) characterShadow.visible = false; 
        level = lvl; document.getElementById('lvl-val').innerText = level;
        const applySetup = () => {
            if (!withCinematic) AudioFX.level();
            spawnLevel(level);
            if (player) { 
                player.visible = true; 
                player.position.set(0, 2, 0); 
                player.rotation.y = -Math.PI / 2;
                resetFallCueState();
            }
            velocityY = 0; velocityX = 0;
            if (withCinematic) { 
                isIntroAnimating = true; 
                introProgress = 0;
                MusicBank.stop();
                CinematicWind.playCinematic(4200);
                camera.position.copy(camStart);
                camera.lookAt(cinematicDoorPos.x, cinematicDoorPos.y, cinematicDoorPos.z);
            } 
            else { 
                isIntroAnimating = false; 
                gameActive = true; 
                levelTransitioning = false;
                MusicBank.playForLevel(level);
                camera.position.copy(camEnd); 
                camera.lookAt(player.position.x, player.position.y + 1, 0); 
            }
        };
        if (showPopup) {
            const popup = document.querySelector('.level-popup');
            document.getElementById('popup-text').innerText = "LEVEL " + level;
            popup.classList.add('active');
            setTimeout(() => {
                popup.classList.remove('active');
                applySetup();
            }, 2200);
        } else {
            applySetup();
        }
    }

    function addPlatform(x, y, w, color) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, 10), new THREE.MeshStandardMaterial({ color: color }));
        mesh.position.set(x, y - 0.75, 0); mesh.receiveShadow = true; scene.add(mesh);
        lowestPlatformSurfaceY = Math.min(lowestPlatformSurfaceY, y);
        platforms.push(mesh); return mesh;
    }

    function spawnGoodDeed(x, y, list) {
        const text = list[Math.floor(Math.random() * list.length)];
        const texData = createTextCanvas(text, 'rgb(61, 61, 61)', 'rgb(255, 250, 101)');
        const dynamicWidth = Math.max(5.0, text.length * 0.75);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(dynamicWidth, 2.2, 1.5), new THREE.MeshStandardMaterial({ map: texData }));
        mesh.position.set(x, y, 0); mesh.castShadow = true; scene.add(mesh);
        items.push({ mesh, text, baseY: y });
    }

    function spawnEnemy(platform, list, speed) {
        const text = list[Math.floor(Math.random() * list.length)];
        const texData = createTextCanvas(text, 'white', 'rgb(255, 77, 77)');
        const dynamicWidth = Math.max(5.0, text.length * 0.75);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(dynamicWidth, 2.2, 2.5), new THREE.MeshStandardMaterial({ map: texData }));
        const platformSurfaceY = platform.position.y + 0.75;
        mesh.position.set(platform.position.x, platformSurfaceY + 1.1, 0);
        mesh.castShadow = true; scene.add(mesh);
        enemies.push({ mesh, platform, dir: 1, speed: speed, surfaceY: platformSurfaceY, width: dynamicWidth });
    }

    function spawnCloud() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        for(let i=0; i<3; i++) {
            const p = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random(), 8, 8), mat);
            p.position.x = i * 1.8; group.add(p);
        }
        group.position.set((Math.random() - 0.5) * 1500, 15 + Math.random() * 10, -200 - Math.random() * 200);
        scene.add(group); clouds.push(group);
    }

    function createTextCanvas(text, color, backColor) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024; canvas.height = 256;

        const safeMarginX = 110;
        const maxTextWidth = canvas.width - safeMarginX * 2;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 2;

        ctx.fillStyle = backColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        function measureTracked(label, fontSize, tracking) {
            ctx.font = `900 ${fontSize}px Arial, sans-serif`;
            let width = 0;
            for (let i = 0; i < label.length; i++) {
                width += ctx.measureText(label[i]).width;
                if (i < label.length - 1) width += tracking;
            }
            return width;
        }

        function drawTracked(label, x, y, fontSize, tracking) {
            ctx.font = `900 ${fontSize}px Arial, sans-serif`;
            let cursor = x;
            for (let i = 0; i < label.length; i++) {
                const letter = label[i];
                ctx.fillText(letter, cursor, y);
                cursor += ctx.measureText(letter).width + tracking;
            }
        }

        let fontSize = 120;
        let tracking = 3.5;
        let measured = measureTracked(text, fontSize, tracking);

        while (measured > maxTextWidth && fontSize > 58) {
            fontSize -= 2;
            tracking = Math.max(1.1, fontSize * 0.025);
            measured = measureTracked(text, fontSize, tracking);
        }

        if (measured > maxTextWidth) {
            tracking = 0;
            measured = measureTracked(text, fontSize, tracking);
        }

        const startX = centerX - measured / 2;
        drawTracked(text, startX, centerY, fontSize, tracking);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        return texture;
    }



    function worldToScreen(pos) {
        if (!camera || !renderer || !pos) return null;
        const projected = pos.clone().project(camera);
        if (projected.z < -1 || projected.z > 1) return null;
        const rect = renderer.domElement.getBoundingClientRect();
        return {
            x: rect.left + (projected.x + 1) * rect.width / 2,
            y: rect.top + (-projected.y + 1) * rect.height / 2
        };
    }

    function getFeedbackSafeScreenPoint(worldPos, type = 'collect') {
        const screen = worldToScreen(worldPos);
        if (!screen) return null;
        const hud = document.querySelector('.ui-container');
        const hudBottom = hud ? hud.getBoundingClientRect().bottom : 0;
        const floatClearance = type === 'fall' ? 88 : 72;
        const safeTop = Math.min(window.innerHeight - 44, Math.max(28, hudBottom + floatClearance));
        const safeX = Math.min(window.innerWidth - 24, Math.max(24, screen.x));
        const safeY = Math.min(window.innerHeight - 28, Math.max(safeTop, screen.y));
        return { x: safeX, y: safeY };
    }

    function spawnMicroAward(text, worldPos, type = 'collect') {
        const screen = getFeedbackSafeScreenPoint(worldPos, type);
        if (!screen) return;
        const award = document.createElement('div');
        award.className = `micro-award ${type}`;
        award.textContent = text;
        award.style.left = `${screen.x}px`;
        award.style.top = `${screen.y}px`;
        document.body.appendChild(award);
        setTimeout(() => award.remove(), type === 'fall' ? 1850 : 900);
    }

    function spawnMicroSparkles(worldPos, mode = 'collect', count = 7) {
        const screen = getFeedbackSafeScreenPoint(worldPos, mode);
        if (!screen) return;
        for (let i = 0; i < count; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'micro-sparkle' + (mode === 'damage' ? ' soft-red' : mode === 'fall' ? ' cloud' : '');
            const radius = mode === 'fall' ? 34 : 24;
            const tx = (Math.random() - 0.5) * radius * 2;
            const ty = (Math.random() - 0.75) * radius * 1.8;
            sparkle.style.left = `${screen.x}px`;
            sparkle.style.top = `${screen.y}px`;
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 760);
        }
    }

    function spawnSoftImpactRing(worldPos) {
        const screen = getFeedbackSafeScreenPoint(worldPos, 'damage');
        if (!screen) return;
        const ring = document.createElement('div');
        ring.className = 'soft-impact-ring';
        ring.style.left = `${screen.x}px`;
        ring.style.top = `${screen.y}px`;
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 540);
    }

    function showCollectFeedback(worldPos) {
        const pos = worldPos.clone();
        pos.y += 1.8;
        spawnMicroAward('+10', pos, 'collect');
        spawnMicroSparkles(pos, 'collect', 8);
    }

    function showStompFeedback(worldPos) {
        const pos = worldPos.clone();
        pos.y += 1.9;
        spawnMicroAward('+5', pos, 'stomp');
        spawnMicroSparkles(pos, 'collect', 9);
    }

    function showDamageFeedback(worldPos) {
        const pos = worldPos.clone();
        pos.y += 1.2;
        spawnSoftImpactRing(pos);
        spawnMicroAward('Careful!', pos, 'damage');
        spawnMicroSparkles(pos, 'damage', 6);
    }

    function showFallFeedback(worldPos) {
        const pos = worldPos.clone();
        pos.y += 1.2;
        spawnMicroAward('Try Again', pos, 'fall');
        spawnMicroSparkles(pos, 'fall', 8);
    }

    function createExplosion(pos) {
        const particleCount = 15;
        const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const material = new THREE.MeshStandardMaterial({ color: 0xffe600, transparent: true });
        for (let i = 0; i < particleCount; i++) {
            const p = new THREE.Mesh(geometry, material.clone());
            p.position.copy(pos);
            p.userData = {
                velocity: new THREE.Vector3((Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.6 + 0.3, (Math.random() - 0.5) * 0.6),
                life: 1.0
            };
            scene.add(p);
            particles.push(p);
        }
    }

    function handleDeath(cause = 'generic') {
        if (isDying) return;
        isDying = true; gameActive = false; 
        resetInput();

        const resolveDeath = () => {
            if (!isDying || !player) return;
            if (cause === 'badEmotion') showDamageFeedback(player.position);
            if (cause === 'fall') showFallFeedback(player.position);
            createExplosion(player.position);
            if (cause === 'badEmotion') AudioFX.lose();
            if (cause === 'fall') AudioFX.burstLose();
            if (cause !== 'fall' && cause !== 'badEmotion') AudioFX.hurt();
            if (cause === 'badEmotion') Haptics.badEmotion();
            lives--;
            document.getElementById('lives-val').innerText = lives;
            if (lives === 1) { AudioFX.heart(); showNotificationAlert(); }
            player.visible = false;
            if (characterShadow) characterShadow.visible = false;
            setTimeout(() => finalizeDeath(), 1200);
        };

        if (cause === 'fall') {
            startFallCue();
            const elapsed = performance.now() - fallCueStartTime;
            const remaining = Math.max(0, 1660 - elapsed);
            setTimeout(resolveDeath, remaining);
        } else {
            resolveDeath();
        }
    }

    function showNotificationAlert() {
        const alert = document.querySelector('.notification-alert');
        alert.style.display = 'block'; setTimeout(() => alert.style.display = 'none', 3500);
    }

    function finalizeDeath() {
        isDying = false;
        if (lives <= 0) showGameOver(false);
        else { startLevelSequence(level, false, false); }
    }

    function goHome() { 
        gameActive = false; isIntroAnimating = false; levelTransitioning = false;
        resetInput();
        MusicBank.stop();
        CinematicWind.stop();
        document.querySelector('.start-screen').style.display = 'flex'; 
        document.querySelector('.game-over-screen').style.display = 'none'; 
        if(player) player.visible = false;
        if(characterShadow) characterShadow.visible = false;
    }

    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }

    let keys = { left: false, right: false, up: false };

    function update(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.position.addScaledVector(p.userData.velocity, dt);
            p.userData.velocity.y -= 0.015 * dt; p.userData.life -= 0.025 * dt;
            p.material.opacity = Math.max(0, p.userData.life);
            if (p.userData.life <= 0) { scene.remove(p); disposeObject(p); particles.splice(i, 1); }
        }
        if (isIntroAnimating) {
            introProgress += 0.0035 * dt; 
            const easing = introProgress < 0.5 ? 4 * introProgress * introProgress * introProgress : 1 - Math.pow(-2 * introProgress + 2, 3) / 2;
            
            player.rotation.y = -Math.PI / 2; 

            const blink1 = introProgress > 0.75 && introProgress < 0.78;
            const blink2 = introProgress > 0.82 && introProgress < 0.85;
            
            if (blink1 || blink2) {
                player.userData.eyes.forEach(eye => eye.scale.y = 0.1);
            } else {
                player.userData.eyes.forEach(eye => eye.scale.y = 1.0);
            }

            if (introProgress > 0.92) {
                const turnEase = (introProgress - 0.92) / 0.08;
                player.rotation.y = THREE.MathUtils.lerp(-Math.PI / 2, 0, turnEase);
            }

            if (introProgress >= 1) { 
                isIntroAnimating = false; 
                CinematicWind.stop();
                gameActive = true; 
                levelTransitioning = false;
                MusicBank.playForLevel(level);
                player.rotation.y = 0; 
                camera.position.copy(camEnd); 
                camera.lookAt(player.position.x, player.position.y + 1, 0);
            }
            else { 
                camera.position.lerpVectors(camStart, camEnd, easing); 
                const lx = THREE.MathUtils.lerp(cinematicDoorPos.x, player.position.x, easing);
                const ly = THREE.MathUtils.lerp(cinematicDoorPos.y, player.position.y + 1, easing);
                camera.lookAt(lx, ly, 0); 
            }
            return;
        }
        if (!gameActive || isDying) { monitorIntroLanding(); return; }
        
        if (keys.left) {
            velocityX = -0.3;
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, Math.PI, 0.15 * dt);
        } else if (keys.right) {
            velocityX = 0.3;
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, 0, 0.15 * dt);
        } else {
            velocityX = 0;
        }

        player.position.x += velocityX * dt;
        let gravityScale = 0.022; 
        velocityY -= gravityScale * dt;
        player.position.y += velocityY * dt;
        const targetScaleY = 1 + velocityY * 0.15;
        player.scale.y = THREE.MathUtils.lerp(player.scale.y, Math.max(0.95, Math.min(1.05, targetScaleY)), 0.15 * dt);
        player.scale.x = player.scale.z = 1 / Math.sqrt(player.scale.y);
        
        let groundedThisFrame = false;
        platforms.forEach(p => {
            const pBox = new THREE.Box3().setFromObject(p);
            const playerBox = new THREE.Box3().setFromObject(player);
            if (playerBox.intersectsBox(pBox)) { 
                if (velocityY <= 0 && player.position.y > p.position.y) { 
                    player.position.y = p.position.y + 1.35; 
                    velocityY = 0; 
                    isJumping = false; 
                    groundedThisFrame = true;
                    fallCueStarted = false;
                    fallCueStartTime = 0;
                    lastGroundCenterY = player.position.y;
                } 
            }
        });

        const playerBottomForFallCue = player.position.y - (0.62 * player.scale.y);
        const passedBelowLowestPlatform = Number.isFinite(lowestPlatformSurfaceY) && playerBottomForFallCue < lowestPlatformSurfaceY - 0.35;
        if (!groundedThisFrame && velocityY < -0.04 && passedBelowLowestPlatform) {
            startFallCue();
        }

        updateCharacterShadow();

        if (!levelTransitioning && door && player.position.distanceTo(door.position) < 4.5) { 
            levelTransitioning = true;
            if (level >= 10) { AudioFX.win(); showGameOver(true); } 
            else startLevelSequence(level + 1, true, true); 
        }

        if (keys.up && !isJumping) { velocityY = 0.45; isJumping = true; AudioFX.jump(); }
        
        for (let idx = items.length - 1; idx >= 0; idx--) {
            const it = items[idx];
            it.mesh.position.y = it.baseY + Math.sin(Date.now() * 0.005) * 0.5;
            if (player.position.distanceTo(it.mesh.position) < 3.0) { 
                scene.remove(it.mesh); 
                disposeObject(it.mesh);
                items.splice(idx, 1); 
                score += 10; 
                document.getElementById('score-val').innerText = score; 
                AudioFX.collect();
                Haptics.collect();
                showCollectFeedback(it.mesh.position);
            }
        }

        for (let idx = enemies.length - 1; idx >= 0; idx--) {
            const en = enemies[idx];
            en.mesh.position.x += en.dir * en.speed * dt;
            en.mesh.position.y = en.surfaceY + 1.1; 
            const halfPlatformWidth = en.platform.geometry.parameters.width / 2;
            const halfEnemyWidth = en.width / 2; 
            const margin = 0.1;
            const relativeX = en.mesh.position.x - en.platform.position.x;
            const limit = halfPlatformWidth - halfEnemyWidth - margin;
            if (Math.abs(relativeX) > limit) { 
                en.dir *= -1; 
                en.mesh.position.x = en.platform.position.x + Math.sign(relativeX) * limit; 
            }
            if (new THREE.Box3().setFromObject(player).intersectsBox(new THREE.Box3().setFromObject(en.mesh))) { 
                if (velocityY < -0.05 && player.position.y > en.mesh.position.y + 0.5) { 
                    scene.remove(en.mesh); 
                    disposeObject(en.mesh);
                    enemies.splice(idx, 1); 
                    velocityY = 0.42; 
                    score += 5;
                    document.getElementById('score-val').innerText = score;
                    AudioFX.overcome();
                    showStompFeedback(en.mesh.position);
                } else handleDeath('badEmotion'); 
            }
        }

        if (player.position.y < -50) handleDeath('fall');
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.1 * dt);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, player.position.y + 6, 0.1 * dt);
        camera.lookAt(player.position.x, player.position.y + 1, 0);
    }

    function showGameOver(win) { 
        gameActive = false; levelTransitioning = false;
        resetInput();
        MusicBank.stop();
        if (!win) AudioFX.gameOver();
        const screen = document.querySelector('.game-over-screen'); 
        screen.querySelector('h1').innerText = win ? "MASTER COLLECTOR!" : "GAME OVER"; 
        document.querySelector('.final-stats').innerText = "Level " + level + " | Score " + score; 
        screen.style.display = 'flex'; 
    }

    function restartGame() { 
        resetInput();
        MusicBank.stop();
        CinematicWind.stop();
        score = 0; lives = 3; level = 1; 
        document.getElementById('score-val').innerText = score; 
        document.getElementById('lives-val').innerText = lives; 
        document.getElementById('lvl-val').innerText = level; 
        document.querySelector('.game-over-screen').style.display = 'none'; 
        document.querySelector('.start-screen').style.display = 'flex'; 
        gameActive = false; 
        if(player) player.visible = false; 
        if(characterShadow) characterShadow.visible = false;
    }

    function animate(currentTime) { 
        requestAnimationFrame(animate); 
        const dt = Math.min(currentTime - lastTime, 100) / 16.66; 
        lastTime = currentTime; 
        update(dt); 
        if (renderer && scene && camera) renderer.render(scene, camera); 
    }

    const bind = (sel, k) => { 
        const el = document.querySelector(sel); 
        if (!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); AudioFX.unlock(); keys[k] = true; }, {passive: false}); 
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; }, {passive: false}); 
        el.addEventListener('mousedown', () => { AudioFX.unlock(); keys[k] = true; }); 
        el.addEventListener('mouseup', () => { keys[k] = false; }); 
    };

    bind('.btn-left', 'left'); bind('.btn-right', 'right'); bind('.btn-jump', 'up');
    
    window.addEventListener('keydown', (e) => { 
        AudioFX.unlock();
        if(e.code === 'ArrowLeft' || e.key === 'a') { keys.left = true; } 
        if(e.code === 'ArrowRight' || e.key === 'd') { keys.right = true; } 
        if(e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') { e.preventDefault(); keys.up = true; } 
    });

    window.addEventListener('keyup', (e) => { 
        if(e.code === 'ArrowLeft' || e.key === 'a') keys.left = false; 
        if(e.code === 'ArrowRight' || e.key === 'd') keys.right = false; 
        if(e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') keys.up = false; 
    });

    document.querySelector('.start-btn').onclick = () => { 
        AudioFX.unlock();
        AudioFX.click();
        document.querySelector('.start-screen').style.display = 'none'; 
        init(); 
        MusicBank.preload();
        restartGameOnlyStats(); 
    };

    function restartGameOnlyStats() { 
        resetInput();
        score = 0; lives = 3; level = 1; 
        document.getElementById('score-val').innerText = score; 
        document.getElementById('lives-val').innerText = lives; 
        document.getElementById('lvl-val').innerText = level; 
        startLevelSequence(1, true, true); 
    }

    document.querySelector('.restart-btn').onclick = restartGame;
    document.querySelector('.home-btn').onclick = goHome;
    document.querySelector('.fullscreen-btn').onclick = toggleFullScreen;

    const musicButton = document.querySelector('.music-btn');
    if (musicButton) {
        let lastMusicToggleTime = 0;
        musicButton.addEventListener('click', (e) => {
            e.preventDefault();
            const now = performance.now();
            if (now - lastMusicToggleTime < 250) return;
            lastMusicToggleTime = now;
            AudioFX.unlock();
            MusicBank.toggle();
        });
    }

    window.addEventListener('resize', () => { 
        if(camera && renderer) { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        } 
    });


    window.onload = function() { 
        MusicBank.setButtonState(); 
        CinematicWind.preload(); 
        animate(performance.now()); 
    }
</script>
</body>
