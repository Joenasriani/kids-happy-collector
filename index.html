<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Collector</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: rgba(255, 230, 0, 1);
            --danger: rgba(255, 71, 87, 1);
            --glass: rgba(255, 255, 255, 0.2);
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif; 
            background: linear-gradient(to bottom, rgb(112, 161, 255), rgb(145, 204, 255)); 
            touch-action: none;
        }
        
        .ui-container {
            position: absolute;
            top: 3vmin;
            left: 3vmin;
            right: 3vmin;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 2vmin;
        }

        .util-row {
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            width: 100%;
        }

        .icon-btn {
            width: 7vmin;
            height: 7vmin;
            background: var(--glass);
            backdrop-filter: blur(0.8vmin);
            border: 0.3vmin solid rgba(255,255,255,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.1);
            transition: transform 0.1s;
            pointer-events: auto;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg { width: 4vmin; height: 4vmin; fill: white; }

        .hud-card {
            background: var(--glass);
            backdrop-filter: blur(1vmin);
            padding: 2vmin 4vmin;
            border-radius: 4vmin;
            border: 0.5vmin solid rgba(255,255,255,0.4);
            color: white;
            font-size: 4vmin;
            font-weight: 900;
            box-shadow: 0 1vmin 3vmin rgba(0,0,0,0.15);
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 0.2vmin 0.5vmin rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-card {
            font-size: 7vmin;
            padding: 3vmin 7vmin;
            border-width: 0.8vmin;
            background: rgba(255, 255, 255, 0.3);
        }

        .message-box {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 2vmin 5vmin;
            border-radius: 6vmin;
            color: rgb(255, 71, 87);
            font-weight: 900;
            font-size: 4vmin;
            display: none;
            box-shadow: 0 1.5vmin 4vmin rgba(0,0,0,0.2);
            z-index: 200;
            border: 0.6vmin solid rgb(255, 71, 87);
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        .notification-alert {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgb(255, 71, 87);
            color: white;
            padding: 2vmin 6vmin;
            border-radius: 4vmin;
            font-family: 'Luckiest Guy', cursive;
            font-size: 5vmin;
            display: none;
            box-shadow: 0 1.5vmin 4vmin rgba(0,0,0,0.3);
            z-index: 2000;
            border: 0.5vmin solid white;
            white-space: nowrap;
            pointer-events: none;
            animation: notifyIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes notifyIn {
            0% { transform: translate(-50%, -20%); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .level-popup {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
        }

        @keyframes levelPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .level-popup.active { display: flex; }
        .level-popup.active h2 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 15vmin;
            color: white;
            text-shadow: 1.2vmin 1.2vmin 0px rgb(255, 71, 87);
            margin: 0;
            animation: levelPop 0.4s linear forwards;
        }

        .controls {
            position: absolute;
            bottom: 5vmin;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .ctrl-group { display: flex; gap: 3vmin; pointer-events: auto; align-items: center; }

        .btn {
            width: 14vmin;
            height: 14vmin;
            background: var(--glass);
            backdrop-filter: blur(1vmin);
            border: 0.4vmin solid rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 6vmin;
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.9); }
        .jump-btn { width: 26vmin; border-radius: 6vmin; font-weight: 900; font-size: 5vmin; }

        .screen-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgb(69, 104, 220), rgb(176, 106, 179));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        .title-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2vmin;
        }

        h1 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 12vmin;
            margin: 0;
            letter-spacing: 0.5vmin;
            text-shadow: 0.8vmin 0.8vmin 0px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .mini-hero {
            position: absolute;
            width: 5.5vmin;
            height: 5.5vmin;
            background: rgb(255, 230, 0);
            border-radius: 1.2vmin;
            box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.3);
            z-index: 10;
            left: 2.8vmin; 
            top: -150vh;
            animation: introHeroSequence 18s linear infinite;
            transform-origin: bottom center;
            opacity: 1;
        }

        .mini-eye {
            position: absolute;
            background: rgb(47, 53, 66);
            width: 1.2vmin;
            height: 1.2vmin;
            top: 1.5vmin;
            border-radius: 0.2vmin;
            animation: eyeBlink 18s linear infinite;
        }
        .mini-eye.left { left: 1.2vmin; }
        .mini-eye.right { right: 1.2vmin; }

        .mini-mouth {
            position: absolute;
            width: 2.2vmin;
            height: 1.1vmin;
            border: 0.4vmin solid rgb(47, 53, 66);
            border-top: none;
            border-radius: 0 0 1.2vmin 1.2vmin;
            bottom: 1vmin;
            left: 50%;
            transform: translateX(-50%);
        }

        .landing-dust {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            animation: dustBurstFade 0.6s ease-out forwards;
        }

        @keyframes dustBurstFade {
            0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
            100% { transform: scale(2.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        @keyframes eyeBlink {
            0%, 25% { transform: scaleY(1); }
            27% { transform: scaleY(0.1); }
            28% { transform: scaleY(1); }
            31% { transform: scaleY(0.1); }
            32% { transform: scaleY(1); }
            35% { transform: scaleY(0.1); }
            36%, 100% { transform: scaleY(1); }
        }

        @keyframes introHeroSequence {
            0%, 16.66% { top: -150vh; transform: scale(1) rotate(0deg); left: 2.8vmin; opacity: 0; filter: blur(0px); }
            18% { opacity: 1; }
            19% { top: -6.9vmin; transform: scale(1.4, 0.6) rotate(-90deg); left: 2.8vmin; filter: blur(0px); }
            20%, 34% { top: -6.9vmin; transform: scale(1, 1) rotate(-90deg); left: 2.8vmin; filter: blur(0px); } 
            36% { top: -6.9vmin; transform: rotate(-45deg) scale(0.9, 1.1); left: 2.8vmin; } 
            38% { top: -6.9vmin; transform: rotate(0deg) scale(1, 1); left: 2.8vmin; }
            41% { top: -6.9vmin; transform: rotate(0deg) scale(1, 1); left: 2.8vmin; filter: blur(0px); }
            42% { transform: scale(0.7, 1.4); left: 2.8vmin; filter: blur(0px); } 
            43.5% { top: -21vmin; left: 12.8vmin; transform: scale(1); filter: blur(0px); }
            45% { top: -6.9vmin; left: 22.8vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            46.5% { top: -6.9vmin; left: 22.8vmin; transform: scale(1, 1); }
            47.5% { transform: scale(0.7, 1.4); left: 22.8vmin; filter: blur(0px); } 
            49% { top: -21vmin; left: 32.6vmin; transform: scale(1); filter: blur(0px); }
            50.5% { top: -6.9vmin; left: 42.4vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            52% { top: -6.9vmin; left: 42.4vmin; transform: scale(1, 1); }
            53% { transform: scale(0.7, 1.4); left: 42.4vmin; filter: blur(0px); }
            54.5% { top: -21vmin; left: 52.2vmin; transform: scale(1); filter: blur(0px); }
            56% { top: -6.9vmin; left: 62.0vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            57.5% { top: -6.9vmin; left: 62.0vmin; transform: scale(1, 1); }
            58.5% { transform: scale(0.7, 1.4); left: 62.0vmin; filter: blur(0px); }
            60% { top: -21vmin; left: 71.8vmin; transform: scale(1); filter: blur(0px); }
            61.5% { top: -6.9vmin; left: 79.6vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            63% { top: -6.9vmin; left: 79.6vmin; transform: scale(1, 1); }
            64% { transform: scale(0.7, 1.4); left: 79.6vmin; filter: blur(0px); }
            65.5% { top: -21vmin; left: 89.3vmin; transform: scale(1); filter: blur(0px); }
            67% { top: -6.9vmin; left: 99.2vmin; transform: scale(1.4, 0.6); filter: blur(0px); }
            68.5% { top: -6.9vmin; left: 99.2vmin; transform: scale(1, 1); }
            73% { transform: scale(1.4, 0.6); left: 99.2vmin; top: -6.9vmin; filter: blur(0px); } 
            76% { transform: scale(1.9, 0.25); left: 99.2vmin; top: -6.9vmin; filter: blur(0px); } 
            77% { transform: scale(0.3, 3.2); left: 99.2vmin; top: -15vmin; filter: blur(1.5vmin); } 
            88% { transform: scale(0.25, 4.0); left: 99.2vmin; top: -250vh; filter: blur(3vmin); } 
            100% { top: -300vh; left: 99.2vmin; transform: scale(0.25, 4.0); filter: blur(4vmin); }
        }

        .instruction-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 3vmin;
            border-radius: 4vmin;
            max-width: 80vmin;
            text-align: center;
            margin-bottom: 3vmin;
        }

        .instruction-item {
            font-size: 3.5vmin;
            margin: 1vmin 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vmin;
        }

        .action-btn {
            background: rgb(46, 213, 115);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 5vmin;
            font-weight: bold;
            border-radius: 8vmin;
            cursor: pointer;
            box-shadow: 0 1vmin 0 rgb(33, 157, 82);
            margin-top: 20px;
            transition: transform 0.1s;
        }
        .action-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 rgb(33, 157, 82); }
    </style>
</head>
<body>

<div id="start-screen" class="screen-overlay">
    <div class="title-container" id="intro-title-container">
        <div class="mini-hero" id="intro-mini-hero">
            <div class="mini-eye left"></div>
            <div class="mini-eye right"></div>
            <div class="mini-mouth"></div>
        </div>
        <h1>Happy Collector</h1>
    </div>
    
    <div class="instruction-box">
        <div class="instruction-item">✨ Collect: Yellow blocks = Good Emotions</div>
        <div class="instruction-item">🚫 Avoid: Red blocks = Bad Emotions</div>
        <div class="instruction-item">❤️ Warning: 3 lives to beat level 10</div>
    </div>

    <button id="start-btn" class="action-btn">PLAY NOW</button>
</div>

<div id="game-over-screen" class="screen-overlay" style="display: none;">
    <h1 class="over-title">GAME OVER</h1>
    <p class="final-stats" style="font-size: 3.5vmin;"></p>
    <button id="restart-btn" class="action-btn">RESTART</button>
</div>

<div class="level-popup">
    <h2 id="popup-text">LEVEL 1</h2>
</div>

<div class="ui-container">
    <div class="util-row">
        <div class="icon-btn" id="home-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <div class="icon-btn" id="fullscreen-btn">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </div>
    </div>
    
    <div class="stats-row">
        <div class="hud-card">LVL: <span id="lvl-val">1</span></div>
        <div class="score-wrapper">
            <div class="hud-card score-card">PTS: <span id="score-val">0</span></div>
            <div id="message-box" class="message-box"></div>
            <div id="notification-alert" class="notification-alert">LAST LIFE: STAY BRAVE! ❤️</div>
        </div>
        <div class="hud-card">LIVES: <span id="lives-val">3</span></div>
    </div>
</div>

<div class="controls">
    <div class="ctrl-group">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-group">
        <div class="btn jump-btn" id="btn-jump">JUMP</div>
    </div>
</div>

<script>
    let scene, camera, renderer, player, door;
    let platforms = [], items = [], enemies = [], clouds = [], particles = [];
    let score = 0, lives = 3, level = 1;
    let velocityY = 0, velocityX = 0, isJumping = false, gameActive = false, isDying = false;
    let isIntroAnimating = false;
    let introProgress = 0;
    let camStart = new THREE.Vector3();
    let camEnd = new THREE.Vector3();
    let lastTime = performance.now();

    const oopsies = ["OH NO!", "STAY CAREFUL!", "OOPS!", "WATCH OUT!", "TRY AGAIN!"];

    let hasDustTriggeredH = false;
    function monitorIntroLanding() {
        const hero = document.getElementById('intro-mini-hero');
        if (!hero || gameActive) return;
        const style = window.getComputedStyle(hero);
        const top = parseFloat(style.top);
        const left = parseFloat(style.left);
        const vmin = Math.min(window.innerWidth, window.innerHeight) / 100;
        if (top > -7.5 * vmin && top < -6.0 * vmin && left < 3.5 * vmin) {
            if (!hasDustTriggeredH) { spawnIntroDust(hero); hasDustTriggeredH = true; }
        } else { if (top < -10 * vmin || left > 5 * vmin) hasDustTriggeredH = false; }
    }

    function spawnIntroDust(target) {
        const rect = target.getBoundingClientRect();
        const container = document.body;
        for (let i = 0; i < 15; i++) {
            const dust = document.createElement('div');
            dust.className = 'landing-dust';
            const size = (Math.random() * 2 + 1) + 'vmin';
            dust.style.width = size; dust.style.height = size;
            dust.style.left = (rect.left + rect.width / 2) + 'px';
            dust.style.top = (rect.bottom - 10) + 'px';
            const tx = (Math.random() - 0.5) * 80;
            const ty = (Math.random() - 0.5) * 40;
            dust.style.setProperty('--tx', `${tx}px`); dust.style.setProperty('--ty', `${ty}px`);
            container.appendChild(dust);
            setTimeout(() => dust.remove(), 600);
        }
    }

    function init() {
        if (renderer) return;
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70a1ff);
        scene.fog = new THREE.FogExp2(0x70a1ff, 0.003);
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(0, 6, 22);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(20, 100, 20);
        sun.castShadow = true;
        scene.add(sun);
        createPlayer();
        startLevelSequence(1);
        for(let i=0; i<30; i++) spawnCloud();
        animate(performance.now());
    }

    function createPlayer() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xffe600, roughness: 0.2 }));
        body.castShadow = true;
        group.add(body);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x2f3542 });
        const lEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        lEye.position.set(0.6, 0.2, 0.25); group.add(lEye);
        const rEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        rEye.position.set(0.6, 0.2, -0.25); group.add(rEye);
        const mouthGeo = new THREE.TorusGeometry(0.15, 0.05, 8, 8, Math.PI);
        const mouth = new THREE.Mesh(mouthGeo, eyeMat);
        mouth.position.set(0.6, -0.1, 0); mouth.rotation.y = Math.PI / 2; mouth.rotation.x = Math.PI;
        group.add(mouth);
        player = group; player.position.set(0, 2, 0); scene.add(player);
    }

    function createDoorMesh() {
        const group = new THREE.Group();
        const frame = new THREE.Mesh(new THREE.BoxGeometry(4.0, 6.0, 0.8), new THREE.MeshStandardMaterial({ color: 0x5d4037 }));
        group.add(frame);
        const panel = new THREE.Mesh(new THREE.BoxGeometry(3.2, 5.4, 0.4), new THREE.MeshStandardMaterial({ color: 0x8d6e63, emissive: 0x3d2b1f, emissiveIntensity: 0.2 }));
        panel.position.z = 0.1; group.add(panel);
        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9 }));
        handle.position.set(1.1, -0.2, 0.5); group.add(handle);
        return group;
    }

    function spawnLevel(lvl) {
        platforms.forEach(p => scene.remove(p));
        items.forEach(it => scene.remove(it.mesh));
        enemies.forEach(en => scene.remove(en.mesh));
        if (door) scene.remove(door);
        platforms = []; items = []; enemies = [];
        const verticalClimb = lvl * 6;
        const segments = 5 + (lvl * 8);
        const gap = 16 + (lvl * 1.8);
        addPlatform(0, -1, 30, 0x2ed573);
        let lastY = -1;
        const goodEmotions = ["BRAVERY", "JOY", "LOVE", "HOPE", "PEACE", "KINDNESS", "CALM", "PRIDE", "GENTLENESS", "TRUST", "CONTENTMENT"];
        const badEmotions = ["SADNESS", "FEAR", "ANGER", "LONELINESS", "GREED", "JEALOUSY", "RUDENESS", "CRUELTY", "GUILT", "ENVY", "HATE", "PANIC", "DESPAIR"];

        for (let i = 1; i < segments; i++) {
            const x = i * gap;
            let currentY = (i / segments) * verticalClimb + (Math.sin(i * 0.5) * 4);
            if (Math.abs(currentY - lastY) < 2.5) currentY += 3.0;
            lastY = currentY;
            const p = addPlatform(x, currentY, 12, 0x7bed9f);
            if (Math.random() > 0.4) spawnGoodDeed(x, currentY + 3.5, goodEmotions);
            else if (Math.random() > 0.3) spawnEnemy(p, badEmotions, 0.04 + (lvl * 0.015));
        }
        const finalX = segments * gap;
        addPlatform(finalX, verticalClimb + 2, 20, 0x2ed573);
        door = createDoorMesh(); door.position.set(finalX, verticalClimb + 6, 0); scene.add(door);
        camStart.set(door.position.x + 30, door.position.y + 15, 60); 
        camEnd.set(player.position.x, player.position.y + 6, 22);
    }

    function startLevelSequence(lvl) {
        gameActive = false;
        level = lvl;
        document.getElementById('lvl-val').innerText = level;
        const popup = document.querySelector('.level-popup');
        document.getElementById('popup-text').innerText = "LEVEL " + level;
        popup.classList.add('active');
        setTimeout(() => {
            popup.classList.remove('active');
            player.position.set(0, 2, 0);
            player.visible = true;
            velocityY = 0; velocityX = 0;
            spawnLevel(level);
            isIntroAnimating = true; introProgress = 0;
        }, 2200);
    }

    function addPlatform(x, y, w, color) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, 10), new THREE.MeshStandardMaterial({ color: color }));
        mesh.position.set(x, y - 0.75, 0); mesh.receiveShadow = true; scene.add(mesh);
        platforms.push(mesh); return mesh;
    }

    function spawnGoodDeed(x, y, list) {
        const text = list[Math.floor(Math.random() * list.length)];
        const tex = createTextCanvas(text, 'rgb(61, 61, 61)', 'rgb(255, 250, 101)');
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(5.0, 2.2, 1.5), new THREE.MeshStandardMaterial({ map: tex }));
        mesh.position.set(x, y, 0); mesh.castShadow = true; scene.add(mesh);
        items.push({ mesh, text });
    }

    function spawnEnemy(platform, list, speed) {
        const text = list[Math.floor(Math.random() * list.length)];
        const tex = createTextCanvas(text, 'white', 'rgb(255, 77, 77)');
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(5.0, 2.2, 2.5), new THREE.MeshStandardMaterial({ map: tex }));
        mesh.position.set(platform.position.x, platform.position.y + 1.8, 0);
        mesh.castShadow = true; scene.add(mesh);
        enemies.push({ mesh, platform, dir: 1, speed: speed });
    }

    function spawnCloud() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        for(let i=0; i<3; i++) {
            const p = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random(), 8, 8), mat);
            p.position.x = i * 1.8; group.add(p);
        }
        group.position.set((Math.random() - 0.5) * 1500, 15 + Math.random() * 10, -200 - Math.random() * 200);
        scene.add(group); clouds.push(group);
    }

    function createTextCanvas(text, color, backColor) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512; canvas.height = 256; 
        ctx.fillStyle = backColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 80px Arial'; ctx.fillStyle = color; ctx.textAlign = 'center';
        ctx.fillText(text, 256, 150);
        return new THREE.CanvasTexture(canvas);
    }

    function createDustBurst(pos) {
        for (let i = 0; i < 20; i++) {
            const size = 0.2 + Math.random() * 0.4;
            const p = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshStandardMaterial({ color: 0x95a5a6, transparent: true, opacity: 0.8 }));
            p.position.copy(pos);
            p.userData.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.6, Math.random() * 0.6, (Math.random() - 0.5) * 0.6);
            p.userData.life = 1.0; scene.add(p); particles.push(p);
        }
    }

    function handleDeath() {
        if (isDying) return;
        isDying = true; gameActive = false; lives--;
        document.getElementById('lives-val').innerText = lives;
        if (lives === 1) showNotificationAlert();
        else if (lives > 0) popMessage(oopsies[Math.floor(Math.random() * oopsies.length)]);
        createDustBurst(player.position); player.visible = false;
        setTimeout(() => finalizeDeath(), 1200);
    }

    function showNotificationAlert() {
        const alert = document.getElementById('notification-alert');
        alert.style.display = 'block'; setTimeout(() => alert.style.display = 'none', 3500);
    }

    function finalizeDeath() {
        isDying = false;
        if (lives <= 0) showGameOver(false);
        else {
            spawnLevel(level);
            player.position.set(0, 2, 0); player.visible = true;
            player.rotation.set(0, 0, 0); player.children[0].material.color.set(0xffe600);
            velocityY = 0; velocityX = 0; isJumping = false; gameActive = true;
        }
    }

    function goHome() { gameActive = false; isIntroAnimating = false; document.getElementById('start-screen').style.display = 'flex'; document.getElementById('game-over-screen').style.display = 'none'; }
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }

    let keys = { left: false, right: false, up: false };

    function update(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.position.addScaledVector(p.userData.velocity, dt);
            p.userData.velocity.y -= 0.01 * dt; p.userData.life -= 0.02 * dt;
            p.material.opacity = p.userData.life;
            if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
        }

        if (isIntroAnimating) {
            introProgress += 0.0035 * dt; 
            const easing = introProgress < 0.5 ? 4 * introProgress * introProgress * introProgress : 1 - Math.pow(-2 * introProgress + 2, 3) / 2;
            if (introProgress >= 1) { isIntroAnimating = false; gameActive = true; camera.position.copy(camEnd); }
            else { camera.position.lerpVectors(camStart, camEnd, easing); camera.lookAt(THREE.MathUtils.lerp(door.position.x, player.position.x, easing), THREE.MathUtils.lerp(door.position.y, player.position.y, easing), 0); }
            return;
        }

        if (!gameActive || isDying) { monitorIntroLanding(); return; }
        
        // Manual control strictly: Reset velocity to 0 if no keys pressed
        if (keys.left) velocityX = -0.3; else if (keys.right) velocityX = 0.3; else velocityX = 0;
        
        player.position.x += velocityX * dt;
        velocityY -= 0.02 * dt; player.position.y += velocityY * dt;
        
        const targetScaleY = 1 + velocityY * 0.3;
        player.scale.y = THREE.MathUtils.lerp(player.scale.y, Math.max(0.9, Math.min(1.15, targetScaleY)), 0.15 * dt);
        player.scale.x = player.scale.z = 1 / Math.sqrt(player.scale.y);

        platforms.forEach(p => {
            const pBox = new THREE.Box3().setFromObject(p);
            const playerBox = new THREE.Box3().setFromObject(player);
            if (playerBox.intersectsBox(pBox)) { if (velocityY <= 0 && player.position.y > p.position.y) { player.position.y = p.position.y + 1.35; velocityY = 0; isJumping = false; } }
        });
        if (door && player.position.distanceTo(door.position) < 4.5) { if (level >= 10) showGameOver(true); else startLevelSequence(level + 1); }
        if (keys.up && !isJumping) { velocityY = 0.5; isJumping = true; }
        items.forEach((it, idx) => {
            it.mesh.position.y += Math.sin(Date.now() * 0.005) * 0.015;
            if (player.position.distanceTo(it.mesh.position) < 3) { scene.remove(it.mesh); items.splice(idx, 1); score += 10; document.getElementById('score-val').innerText = score; }
        });
        
        // Red block boundary logic: back and forth strictly on the green platform
        enemies.forEach((en, idx) => {
            en.mesh.position.x += en.dir * en.speed * dt;
            
            const halfPlatformWidth = en.platform.geometry.parameters.width / 2;
            const halfEnemyWidth = 2.5; // Half of enemy width (5.0)
            const margin = 0.2; 
            const limit = halfPlatformWidth - halfEnemyWidth - margin;
            
            const relativeX = en.mesh.position.x - en.platform.position.x;
            if (Math.abs(relativeX) > limit) {
                en.dir *= -1;
                en.mesh.position.x = en.platform.position.x + Math.sign(relativeX) * limit;
            }

            if (new THREE.Box3().setFromObject(player).intersectsBox(new THREE.Box3().setFromObject(en.mesh))) { 
                if (velocityY < -0.05 && player.position.y > en.mesh.position.y + 0.5) { 
                    scene.remove(en.mesh); enemies.splice(idx, 1); velocityY = 0.42; 
                } else handleDeath(); 
            }
        });
        if (player.position.y < -50) handleDeath();
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.1 * dt);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, player.position.y + 6, 0.1 * dt);
        camera.lookAt(player.position.x, player.position.y + 1, 0);
    }

    function showGameOver(win) { gameActive = false; const screen = document.getElementById('game-over-screen'); screen.querySelector('h1').innerText = win ? "MASTER COLLECTOR!" : "GAME OVER"; document.querySelector('.final-stats').innerText = "Level " + level + " | Score " + score; screen.style.display = 'flex'; }
    function restartGame() { score = 0; lives = 3; level = 1; document.getElementById('score-val').innerText = score; document.getElementById('lives-val').innerText = lives; document.getElementById('lvl-val').innerText = level; document.getElementById('game-over-screen').style.display = 'none'; startLevelSequence(1); }

    function animate(currentTime) { 
        requestAnimationFrame(animate); 
        const dt = Math.min(currentTime - lastTime, 100) / 16.66; lastTime = currentTime;
        update(dt); if (renderer && scene && camera) renderer.render(scene, camera); 
    }

    const bind = (id, k) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; }, {passive: false});
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; }, {passive: false});
        el.addEventListener('mousedown', () => { keys[k] = true; });
        el.addEventListener('mouseup', () => { keys[k] = false; });
    };
    bind('btn-left', 'left'); bind('btn-right', 'right'); bind('btn-jump', 'up');
    window.addEventListener('keydown', (e) => { if(e.code === 'ArrowLeft' || e.key === 'a') keys.left = true; if(e.code === 'ArrowRight' || e.key === 'd') keys.right = true; if(e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') { e.preventDefault(); keys.up = true; } });
    window.addEventListener('keyup', (e) => { if(e.code === 'ArrowLeft' || e.key === 'a') keys.left = false; if(e.code === 'ArrowRight' || e.key === 'd') keys.right = false; if(e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') keys.up = false; });
    document.getElementById('start-btn').onclick = () => { document.getElementById('start-screen').style.display = 'none'; init(); restartGame(); };
    document.getElementById('restart-btn').onclick = restartGame;
    document.getElementById('home-btn').onclick = goHome;
    document.getElementById('fullscreen-btn').onclick = toggleFullScreen;
    function popMessage(txt) { const msg = document.getElementById('message-box'); if(msg) { msg.innerText = txt; msg.style.display = 'block'; setTimeout(() => { msg.style.display = 'none'; }, 1500); } }
    window.addEventListener('resize', () => { if(camera && renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } });
</script>
</body>
